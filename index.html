<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f3d5e">
<title>Gold Miner HSK 4 | Bài 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --bg-top:#0f3d5e;
  --bg-mid:#155e75;
  --bg-bot:#1e7898;
  --cream:#fffdf7;
  --amber:#f59e0b;
  --amber-dark:#b45309;
  --ink:#0f172a;
  --muted:#64748b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:linear-gradient(160deg,var(--bg-top) 0%,var(--bg-mid) 50%,var(--bg-bot) 100%);
  color:var(--ink);
  font-family:var(--font-ui);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.page{
  max-width:1140px;
  width:100%;
  height:100dvh;
  margin:0 auto;
  padding:8px 14px 10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:hidden;
}
.page:fullscreen{
  max-width:none;
  background:linear-gradient(160deg,var(--bg-top) 0%,var(--bg-mid) 50%,var(--bg-bot) 100%);
  padding:10px max(16px,3vw);
}
.top{
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-icon{font-size:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));flex-shrink:0}
h1{
  margin:0;
  font-family:var(--font-zh),var(--font-ui);
  font-size:clamp(18px,2.2vw,24px);
  color:#fef3c7;
  text-shadow:0 2px 4px rgba(0,0,0,.35);
  white-space:nowrap;
  line-height:1.15;
}
.subtitle{
  font-weight:600;
  color:#bae6fd;
  font-size:12px;
  margin-top:2px;
  white-space:nowrap;
}
.stats{display:flex;gap:7px;flex-shrink:0}
.stat{
  background:rgba(15,23,42,.42);
  backdrop-filter:blur(6px);
  color:#e0f2fe;
  border:1.5px solid rgba(253,224,71,.35);
  border-radius:11px;
  padding:5px 11px;
  box-shadow:0 3px 0 rgba(15,23,42,.35);
  font-size:11px;
  font-weight:700;
  min-width:78px;
  text-align:center;
  line-height:1.2;
}
.stat strong{
  display:block;
  font-size:18px;
  color:#fde047;
  margin-top:1px;
  font-variant-numeric:tabular-nums;
}
.question{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--cream);
  border:3px solid #f59e0b;
  box-shadow:0 4px 0 #b45309,0 8px 18px rgba(0,0,0,.22);
  border-radius:16px;
  padding:8px 12px;
}
.illustration{
  flex:0 0 138px;
  align-self:stretch;
  border-radius:11px;
  background:linear-gradient(155deg,#e0f2fe,#fef9c3 65%,#bbf7d0);
  border:1.5px solid #cbd5e1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:6px 6px 5px;
  position:relative;
  overflow:hidden;
}
.illustration::after{
  content:"";
  position:absolute;
  height:28px;
  background:rgba(134,239,172,.45);
  bottom:-14px;
  left:-8px;
  right:-8px;
  border-radius:50%;
}
.illustration span{
  font-size:clamp(24px,3vw,34px);
  z-index:1;
  letter-spacing:-3px;
  white-space:nowrap;
  filter:drop-shadow(1px 3px 2px rgba(0,0,0,.15));
  animation:bounce 3s ease-in-out infinite;
}
.art-caption{
  z-index:1;
  position:relative;
  font-family:var(--font-zh);
  background:rgba(255,255,255,.88);
  color:#1e293b;
  border-radius:7px;
  padding:2px 8px;
  font-size:13px;
  text-align:center;
  font-weight:700;
  border:1px solid rgba(203,213,225,.7);
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.qbody{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
  gap:4px;
}
.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}
.meta{
  font-size:12px;
  color:#b45309;
  font-weight:800;
  letter-spacing:.03em;
  background:#fef3c7;
  padding:2px 9px;
  border-radius:999px;
}
.hint{font-size:12px;color:var(--muted);font-weight:600}
.sentence{
  font-family:var(--font-zh);
  font-size:clamp(18px,2.35vw,27px);
  line-height:1.42;
  font-weight:700;
  color:#0f172a;
  overflow-wrap:anywhere;
}
.blank{
  display:inline-block;
  min-width:86px;
  border-bottom:3px solid #d97706;
  background:#fef3c7;
  border-radius:7px;
  text-align:center;
  color:#b45309;
  padding:0 8px;
  margin:0 3px;
  transition:all .2s ease;
}
.blank.filled{
  background:#d1fae5;
  border-bottom-color:#059669;
  color:#065f46;
}
.board-wrap{
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.board{
  border:4px solid #d97706;
  border-radius:18px;
  background:#6d371b;
  overflow:hidden;
  position:relative;
  box-shadow:0 10px 26px rgba(0,0,0,.35);
}
#mine{
  display:block;
  width:100%;
  height:100%;
  cursor:crosshair;
  touch-action:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.overlay{
  position:absolute;
  inset:0;
  background:rgba(15,23,42,.74);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  z-index:3;
}
.overlay.visible{display:flex}
.dialog{
  background:linear-gradient(#fffdf7,#fef3c7);
  border:4px solid #f59e0b;
  box-shadow:0 8px 0 #92400e,0 24px 50px rgba(0,0,0,.45);
  border-radius:20px;
  text-align:center;
  padding:20px 22px;
  max-width:440px;
  width:100%;
}
.dialog h2{
  font-family:var(--font-zh),var(--font-ui);
  font-size:clamp(20px,2.8vw,28px);
  color:#78350f;
  margin:0 0 8px;
}
.dialog p{
  line-height:1.55;
  font-size:14.5px;
  margin:0 0 16px;
  color:#475569;
  white-space:pre-line;
}
.dialog-actions{display:flex;flex-direction:column;gap:8px;align-items:center}
.dialog-actions button{width:100%;max-width:300px}
.bottom-bar{
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.message{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  line-height:1.35;
  background:rgba(255,253,247,.95);
  border:2px solid #fcd34d;
  border-radius:10px;
  color:#78350f;
  font-size:13.5px;
  font-weight:700;
  padding:4px 12px;
  transition:background .2s,border-color .2s,color .2s;
}
.message.ok{background:#ecfdf5;border-color:#34d399;color:#065f46}
.message.err{background:#fff1f2;border-color:#fda4af;color:#9f1239}
.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}
button,.toggle-pill{
  font-family:var(--font-ui);
  border:1.5px solid #d97706;
  border-bottom:4px solid #b45309;
  background:linear-gradient(#fde047,#f59e0b);
  border-radius:11px;
  padding:7px 13px;
  color:#451a03;
  font-size:13.5px;
  font-weight:800;
  cursor:pointer;
  min-height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  box-shadow:0 2px 5px rgba(0,0,0,.15);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
button:active,.toggle-pill:active{transform:translateY(2px);border-bottom-width:2px}
button:focus-visible,.toggle-pill:has(input:focus-visible){outline:3px solid #38bdf8;outline-offset:2px}
button.secondary,.toggle-pill{
  background:linear-gradient(#ffffff,#f1f5f9);
  border-color:#94a3b8;
  border-bottom-color:#64748b;
  color:#1e293b;
}
.toggle-pill{font-weight:700;padding:6px 11px}
.toggle-pill input{accent-color:#0284c7;margin:0;width:15px;height:15px;cursor:pointer}
.toggle-pill:has(input:checked){
  background:linear-gradient(#e0f2fe,#bae6fd);
  border-color:#0284c7;
  border-bottom-color:#0369a1;
  color:#0c4a6e;
}
.kbd-hint{
  font-size:11px;
  background:rgba(69,26,3,.14);
  padding:1px 6px;
  border-radius:5px;
  font-weight:700;
}
@media (hover:none) and (pointer:coarse){
  .kbd-hint{display:none}
}
@media(max-width:680px){
  .page{padding:6px 7px 8px;gap:6px}
  .top{flex-direction:column;align-items:stretch;gap:5px}
  .logo{justify-content:center}
  .logo-icon{font-size:22px}
  h1{font-size:17px}
  .subtitle{font-size:11px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .stat{min-width:0;padding:4px 4px;border-radius:9px;font-size:10px}
  .stat strong{font-size:14.5px}
  .question{gap:8px;padding:6px 8px;border-width:2.5px;border-radius:13px}
  .illustration{flex:0 0 88px;padding:4px;gap:3px}
  .illustration span{font-size:21px;letter-spacing:-3px}
  .art-caption{font-size:11px;padding:1px 5px}
  .meta{font-size:11px;padding:1px 7px}
  .hint{display:none}
  .sentence{font-size:clamp(15.5px,4.2vw,20px);line-height:1.36}
  .blank{min-width:64px;padding:0 5px;border-bottom-width:2.5px}
  .board{border-width:3px;border-radius:14px}
  .message{font-size:12.5px;min-height:30px;padding:4px 8px;border-radius:9px}
  .controls{gap:5px;flex-wrap:nowrap}
  .controls button,.toggle-pill{padding:6px 8px;min-height:36px;font-size:12.5px;border-radius:9px}
  #fire{flex:1 1 auto;min-width:96px}
  .btn-label{display:none}
  .dialog{padding:16px}
  .dialog p{font-size:13.5px}
}
@media(max-height:500px){
  body{overflow-y:auto}
  .page{height:auto;min-height:100dvh;overflow:visible}
  .board-wrap{min-height:300px}
}
</style>
</head>
<body>

</div>

const canvas=$('mine'),ctx=canvas.getContext('2d');
const mobileQuery=window.matchMedia('(max-width: 680px)');
let isMobile=mobileQuery.matches;
let W=1100,H=640,pivot={x:550,y:180},GOLD_SLOTS=[],ANGLE_MAX=1.18,HOOK_MAX=600;
const HOOK_MIN=34;
const FONT_ZH='"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
const FONT_UI='"Be Vietnam Pro","Segoe UI",system-ui,sans-serif';

function getSlots(mobile){
  return mobile?[
    {angle:-1.00,length:300},{angle:-.65,length:425},{angle:-.33,length:340},
    {angle:0,length:475},
    {angle:.33,length:340},{angle:.65,length:425},{angle:1.00,length:300}
  ]:[
    {angle:-1.12,length:460},{angle:-.84,length:385},{angle:-.56,length:445},{angle:-.28,length:315},
    {angle:0,length:405},
    {angle:.28,length:315},{angle:.56,length:445},{angle:.84,length:385},{angle:1.12,length:460}
  ];
}

function fitBoard(){
  const wrap=$('boardWrap'),board=$('board');
  const cw=wrap.clientWidth,ch=wrap.clientHeight;
  if(!cw||!ch)return;
  const ratio=W/H;
  let bw=cw,bh=bw/ratio;
  if(bh>ch){bh=ch;bw=bh*ratio;}
  board.style.width=Math.floor(bw)+'px';
  board.style.height=Math.floor(bh)+'px';
}

function applyViewportConfig(reposition){
  const nextMobile=mobileQuery.matches;
  const modeChanged=nextMobile!==isMobile;
  isMobile=nextMobile;
  W=isMobile?680:1100;
  H=isMobile?740:640;
  pivot=isMobile?{x:340,y:174}:{x:550,y:180};
  GOLD_SLOTS=getSlots(isMobile);
  ANGLE_MAX=isMobile?1.08:1.18;
  HOOK_MAX=isMobile?620:600;
  canvas.width=W;
  canvas.height=H;
  if(reposition&&modeChanged&&objects.length){
    const aid=attached?attached.id:null;
    spawn(true);
    if(aid!==null)attached=objects.find(o=>o.id===aid)||null;
  }
  fitBoard();
}

let stage='intro',level=0,question=0,score=0,money=0,remaining=900;
let angle=0,dir=1,lineLength=HOOK_MIN,mode='swing',attached=null,objects=[],popups=[];
let lastMistake=null,soundOn=true,audioContext=null,lastTime=0,transitionRemaining=0,reelPhase=0,showCompletedWord=false;
const getNoTimer=()=> $('noTimer').checked;
const rand=(low,high)=>low+Math.random()*(high-low);
function shuffle(xs){let a=xs.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setMessage(v,type=''){
  const el=$('message');
  el.textContent=v;
  el.classList.remove('ok','err');
  if(type)el.classList.add(type);
}
function sound(freq=650,duration=.10){if(!soundOn)return;try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),gain=audioContext.createGain();o.connect(gain);gain.connect(audioContext.destination);o.type='sine';o.frequency.setValueAtTime(freq,audioContext.currentTime);gain.gain.setValueAtTime(.06,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);o.start();o.stop(audioContext.currentTime+duration)}catch(e){}}
function speakChinese(text){
  if(!soundOn||!('speechSynthesis' in window))return;
  try{const engine=window.speechSynthesis;engine.cancel();const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=.88;u.pitch=1.05;u.volume=1;
  const vs=engine.getVoices();const voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang));if(voice)u.voice=voice;
  engine.speak(u);}catch(e){}
}
function saveProgress(){try{localStorage.setItem('hsk4_miner_v3',JSON.stringify({question,score,money,remaining,lastMistake}));}catch(e){}}
function getProgress(){try{const p=JSON.parse(localStorage.getItem('hsk4_miner_v3'));return p&&Number.isInteger(p.question)&&p.question>0&&p.question<28?p:null;}catch(e){return null;}}
function clearProgress(){try{localStorage.removeItem('hsk4_miner_v3')}catch(e){}}
function setPauseLabel(paused){
  $('pause').innerHTML=paused?'&#9654;<span class="btn-label"> Ti&#7871;p t&#7909;c</span>':'&#9208;<span class="btn-label"> T&#7841;m d&#7915;ng</span>';
}
function resumeAt(snapshot,timeBonus=0){
  question=Math.max(0,Math.min(data.length-1,snapshot.question));score=Math.max(0,snapshot.score||0);money=Math.max(0,snapshot.money||0);
  remaining=Math.max(0,snapshot.remaining||0)+timeBonus;lastMistake=snapshot.lastMistake??null;
  showCompletedWord=false;transitionRemaining=0;stage='playing';spawn();renderQuestion();saveProgress();
  setMessage(`✨ Tiếp tục từ câu ${question+1}, không cần chơi lại từ đầu!`);setPauseLabel(false);
}
function spawn(keepQuestionState=false){
  const ids=shuffle(data.map((_,i)=>i).filter(i=>i!==question)).slice(0,GOLD_SLOTS.length-1);
  const sorted=shuffle([question,...ids]);
  objects=sorted.map((id,i)=>{
    const lane=GOLD_SLOTS[i],a=lane.angle+rand(-.01,.01),length=lane.length+rand(-5,5);
    return {id,x:pivot.x+Math.sin(a)*length,y:pivot.y+Math.cos(a)*length,r:48,visible:true};
  });
  if(!keepQuestionState){angle=0;dir=1;lineLength=HOOK_MIN;mode='swing';attached=null;}
}
function renderQuestion(){
  const item=data[question];
  if(!item)return;
  $('scene').textContent=item.scene;$('sceneCaption').textContent=item.context;
  const parts=item.sentence.split('____');
  $('sentence').textContent='';
  $('sentence').append(document.createTextNode(parts[0]||''));
  const span=document.createElement('span');
  span.className=showCompletedWord?'blank filled':'blank';
  span.textContent=showCompletedWord?item.word:'______';
  $('sentence').append(span,document.createTextNode(parts.slice(1).join('____')));
  $('progress').textContent=`Câu ${question+1} / 28  ·  Màn ${Math.floor(question/4)+1} / 7`;
  updateStats();
}
function updateStats(){
  $('score').textContent=score;$('money').textContent=money;
  $('level').textContent=`${Math.min(7,Math.floor(question/4)+1)} / 7`;
  const seconds=Math.max(0,Math.ceil(remaining));$('time').textContent=getNoTimer()?'∞':`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
}
function overlay(title,body,action,callback,secondaryText=null,secondaryFn=null){
  stage='dialog';$('overlayTitle').textContent=title;$('overlayText').textContent=body;$('overlayButton').textContent=action;
  $('overlay').classList.add('visible');
  $('overlayButton').onclick=()=>{$('overlay').classList.remove('visible');callback();};
  const extra=$('overlaySecondary');extra.style.display=secondaryText?'inline-flex':'none';
  if(secondaryText){extra.textContent=secondaryText;extra.onclick=()=>{$('overlay').classList.remove('visible');secondaryFn();};}
}

function reset(){clearProgress();stage='playing';level=1;question=0;score=0;money=0;remaining=900;lastMistake=null;transitionRemaining=0;showCompletedWord=false;popups=[];spawn();renderQuestion();setMessage('✨ Canh thước ngắm và chọn thỏi vàng chứa từ phù hợp với câu.');setPauseLabel(false);}
function start(){reset();}
function pause(){if(stage==='playing'){stage='paused';setPauseLabel(true);setMessage('⏸ Đang tạm dừng.');}else if(stage==='paused'){stage='playing';setPauseLabel(false);setMessage('⛏ Tiếp tục đào vàng!');}}
function fire(){if(stage!=='playing'||mode!=='swing')return;mode='out';sound(440);}
function endOfGame(won){
  mode='swing';
  if(won){clearProgress();speakChinese('张老师为你骄傲。');
  overlay('张老师为你骄傲。',`🏆 Hoàn thành 28 / 28 câu! Tổng điểm: ${score}.\nBạn đã chinh phục toàn bộ từ vựng bài 入乡随俗!`,'↻ Chơi lại từ đầu',reset);
  }else{
  lastMistake=question;saveProgress();const snapshot={question,score,money,remaining:0,lastMistake};
  overlay('⏳ Hết giờ!',`Bạn đã làm được ${question}/28 câu. Không mất tiến độ!\nBạn có thể chơi tiếp ngay từ câu ${question+1}.`,'▶ Tiếp tục câu đang dở (+5 phút)',()=>resumeAt(snapshot,300),'↻ Chơi lại từ đầu',reset);
  }
}

function advance(){
  showCompletedWord=false;
  question++;saveProgress();
  if(question>=data.length){endOfGame(true);return;}
  if(question%4===0){stage='level';updateStats();overlay(`MÀN ${Math.floor(question/4)+1} / 7`,`Đã hoàn thành ${question}/28 câu. Chuẩn bị cho màn kế tiếp!`,'▶ Tiếp tục',()=>{stage='playing';spawn();renderQuestion();setMessage('✨ Màn mới! Tiếp tục đào từ đúng nhé.');});return;}
  spawn();renderQuestion();setMessage('✅ Tốt lắm! Câu tiếp theo.');
}
function addPopup(x,y,text,color){
  popups.push({x,y,text,color,life:0.95,maxLife:0.95});
}
function returnHook(){
  lineLength=HOOK_MIN;mode='swing';
  if(!attached)return;
  const nugget=attached;attached=null;nugget.visible=false;
  if(nugget.id===question){
    score+=100;money+=100;showCompletedWord=true;
    renderQuestion();sound(850,.2);speakChinese('对了');
    setMessage(`✅ 对了！ "${data[question].word}" +100 điểm!`,'ok');
    addPopup(pivot.x,pivot.y+50,'+100 ⭐','#34d399');
    mode='transition';transitionRemaining=1.05;
  }else{
    score=Math.max(0,score-5);lastMistake=question;saveProgress();
    setMessage(`❌ 错了！ Từ "${data[nugget.id].word}" chưa đúng (−5 điểm). Hãy chọn thỏi vàng khác!`,'err');
    addPopup(pivot.x,pivot.y+50,'−5','#fb7185');
    sound(200,.16);speakChinese('错了');
  }
}

function hitsNugget(hx,hy,o){
  const scale=isMobile?1.06:1.0;
  const rx=56*scale+10,ry=39*scale+10;
  const dx=(hx-o.x)/rx,dy=(hy-o.y)/ry;
  return dx*dx+dy*dy<=1;
}
function findAimTarget(){
  const sx=Math.sin(angle),sy=Math.cos(angle);
  for(let d=HOOK_MIN+10;d<=HOOK_MAX;d+=5){
    const tx=pivot.x+sx*d,ty=pivot.y+sy*d;
    if(tx<24||tx>W-24||ty>H-20)break;
    const hit=objects.find(o=>o.visible&&hitsNugget(tx,ty,o));
    if(hit)return {hit,dist:d,x:tx,y:ty};
  }
  return null;
}

function step(dt){
  if(stage!=='playing')return;
  reelPhase+=dt*((mode==='back')?9:(mode==='out'?4:0.8));
  for(let i=popups.length-1;i>=0;i--){popups[i].life-=dt;popups[i].y-=38*dt;if(popups[i].life<=0)popups.splice(i,1);}
  if(mode==='transition'){transitionRemaining-=dt;if(transitionRemaining<=0)advance();return;}
  if(!getNoTimer()){
    remaining=Math.max(0,remaining-dt);
    if(remaining<=0){updateStats();endOfGame(false);return;}
  }
  if(mode==='swing'){
    angle+=dir*dt*0.88;
    if(angle>ANGLE_MAX){angle=ANGLE_MAX;dir=-1;}
    if(angle<-ANGLE_MAX){angle=-ANGLE_MAX;dir=1;}
  }else if(mode==='out'){
    lineLength+=740*dt;
    const hx=pivot.x+Math.sin(angle)*lineLength,hy=pivot.y+Math.cos(angle)*lineLength;
    const found=objects.find(o=>o.visible&&hitsNugget(hx,hy,o));
    if(found){attached=found;mode='back';sound(found.id===question?770:320);}
    else if(lineLength>HOOK_MAX||hx<24||hx>W-24||hy>H-20)mode='back';
  }else if(mode==='back'){
    lineLength-=dt*(attached?560:860);
    if(lineLength<=HOOK_MIN)returnHook();
  }
  updateStats();
}
function rounded(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function line(points,color,width=3){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.stroke();}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
function background(){
  let sky=ctx.createLinearGradient(0,0,0,190);sky.addColorStop(0,'#38bdf8');sky.addColorStop(.6,'#bae6fd');sky.addColorStop(1,'#e0f2fe');ctx.fillStyle=sky;ctx.fillRect(0,0,W,195);
  for(let i=0;i<6;i++){let x=82+i*199,y=36+(i%2)*24;ellipse(x,y+10,44,14,'rgba(255,255,255,.72)');ellipse(x-22,y,25,17,'rgba(255,255,255,.82)');ellipse(x+20,y-4,30,20,'rgba(255,255,255,.9)');}
  ctx.fillStyle='#93c5fd';ctx.beginPath();ctx.moveTo(0,154);for(let x=0;x<=W;x+=12)ctx.lineTo(x,140+30*Math.sin(x/105)+5*Math.cos(x/22));ctx.lineTo(W,190);ctx.lineTo(0,190);ctx.fill();
  ctx.fillStyle='#6ee7b7';ctx.beginPath();ctx.moveTo(0,166);for(let x=0;x<=W;x+=12)ctx.lineTo(x,163+14*Math.sin(x/59));ctx.lineTo(W,195);ctx.lineTo(0,195);ctx.fill();
  rounded(0,164,W,22,0,'#4ade80');rounded(0,179,W,13,0,'#16a34a');
  for(let i=0;i<90;i++){let x=(i*167+31)%W,y=174+((i*17)%8);ellipse(x,y,2,3.8,i%7?'#86efac':'#fef08a');}
  let ground=ctx.createLinearGradient(0,188,0,H);ground.addColorStop(0,'#9a582b');ground.addColorStop(.5,'#783f1d');ground.addColorStop(1,'#4a2310');ctx.fillStyle=ground;ctx.fillRect(0,188,W,H-188);
  ctx.beginPath();ctx.moveTo(0,320);for(let x=0;x<=W;x+=20)ctx.lineTo(x,319+8*Math.sin(x/66));ctx.lineWidth=2.5;ctx.strokeStyle='rgba(251,191,36,.22)';ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,495);for(let x=0;x<=W;x+=20)ctx.lineTo(x,502+11*Math.sin(x/73));ctx.lineWidth=2.5;ctx.strokeStyle='rgba(251,191,36,.15)';ctx.stroke();
  for(let i=0;i<110;i++){let x=(i*227+67)%W,y=202+(i*119)%(H-216),radius=1+(i%4);ellipse(x,y,radius*1.6,radius*.85,i%5?'rgba(253,224,71,.12)':'rgba(41,19,8,.28)');}
  const rocks=isMobile?[[65,305,.85],[615,310,.95],[80,585,.9],[605,595,1.0]]:[[95,310,.95],[985,312,1.1],[120,530,1.0],[1000,545,1.15],[510,335,.55],[790,565,.75]];
  for(const [x,y,s] of rocks)stone(x,y,s);
}
function stone(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(-34,13);ctx.lineTo(-20,-16);ctx.lineTo(4,-24);ctx.lineTo(26,-14);ctx.lineTo(36,15);ctx.quadraticCurveTo(0,32,-34,13);ctx.fillStyle='#64748b';ctx.fill();ctx.beginPath();ctx.moveTo(-20,-16);ctx.lineTo(4,-24);ctx.lineTo(-1,11);ctx.lineTo(-34,13);ctx.fillStyle='#94a3b8';ctx.fill();ctx.restore();}
function miner(){
  const bob=Math.sin(reelPhase*2)*2;
  const baseY=pivot.y-2;
  ellipse(pivot.x-68,baseY+2,106,8,'rgba(20,83,45,.32)');
  if(MINER_IMG.complete&&MINER_IMG.naturalWidth)ctx.drawImage(MINER_IMG,pivot.x-172,baseY-172+bob,224,174);
  else {ctx.font='96px serif';ctx.fillText('👴',pivot.x-135,baseY-36);}
  const wx=pivot.x+60,wy=baseY-58;
  // Cable feed from drum to guide pulley at pivot
  line([[wx-22,wy+14],[pivot.x,pivot.y]],'#475569',5);
  line([[wx-22,wy+14],[pivot.x,pivot.y]],'#e2e8f0',2);
  // Winch stand
  line([[pivot.x+28,wy+18],[pivot.x+10,baseY+2]],'#5c381c',10);
  line([[pivot.x+90,wy+18],[pivot.x+116,baseY+2]],'#5c381c',10);
  line([[pivot.x+4,baseY+2],[pivot.x+120,baseY+2]],'#b47b44',8);
  // Guide pulley bracket & wheel centered right on pivot
  line([[pivot.x+14,baseY-10],[pivot.x,pivot.y]],'#475569',6);
  ellipse(pivot.x,pivot.y,8.5,8.5,'#334155');
  ellipse(pivot.x,pivot.y,5.5,5.5,'#fbbf24');
  ellipse(pivot.x,pivot.y,2,2,'#1e293b');
  // Winch drum
  ellipse(wx,wy,38,31,'#56361f');ellipse(wx,wy,32,26,'#b8803b');
  for(let i=0;i<7;i++){let a=reelPhase+i*Math.PI*2/7;line([[wx+Math.cos(a)*8,wy+Math.sin(a)*6],[wx+Math.cos(a)*25,wy+Math.sin(a)*21]],'#75441e',4.5);}
  ellipse(wx,wy,14,14,'#fbbf24');ellipse(wx,wy,5.5,5.5,'#72421f');
  ellipse(wx-34,wy,8,33,'#684122');ellipse(wx+34,wy,8,33,'#684122');
  for(let i=0;i<5;i++)line([[wx-20+i*10,wy-21],[wx-20+i*10,wy+21]],'rgba(254,243,199,.45)',2);
  const cx=wx+Math.cos(reelPhase)*21,cy=wy+Math.sin(reelPhase)*19;
  line([[wx,wy],[cx,cy]],'#e2e8f0',6);ellipse(cx,cy,9,9,'#fde047');
  if(mode==='out'||mode==='back'){
    ctx.beginPath();ctx.arc(wx,wy,43,reelPhase,reelPhase+.55);ctx.strokeStyle='rgba(254,240,138,.78)';ctx.lineWidth=3;ctx.stroke();
  }
}
function goldPiece(g,x,y,isAimed){
  const scale=isMobile?1.06:1.0;
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  if(isAimed){
    ctx.shadowColor='#38bdf8';ctx.shadowBlur=18;
  }else{
    ctx.shadowColor='rgba(41,19,8,.42)';ctx.shadowBlur=10;ctx.shadowOffsetY=6;
  }
  const grad=ctx.createLinearGradient(-56,-38,48,40);
  grad.addColorStop(0,'#fef9c3');grad.addColorStop(.28,'#fde047');grad.addColorStop(.72,'#f59e0b');grad.addColorStop(1,'#d97706');
  ctx.beginPath();
  ctx.moveTo(-55,-10);ctx.lineTo(-42,-33);ctx.lineTo(-12,-38);ctx.lineTo(14,-33);
  ctx.lineTo(38,-37);ctx.lineTo(57,-16);ctx.lineTo(55,17);ctx.lineTo(34,36);
  ctx.lineTo(0,39);ctx.lineTo(-34,34);ctx.lineTo(-54,15);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.lineWidth=isAimed?3.5:2.8;
  ctx.strokeStyle=isAimed?'#fef08a':'#92400e';
  ctx.stroke();
  ctx.beginPath();ctx.moveTo(-43,-16);ctx.quadraticCurveTo(-32,-33,-11,-28);ctx.lineTo(18,-26);
  ctx.strokeStyle='rgba(255,255,255,.68)';ctx.lineWidth=5.5;ctx.lineCap='round';ctx.stroke();
  ctx.fillStyle='#451a03';ctx.textAlign='center';ctx.textBaseline='middle';
  let font=28;const word=data[g.id].word;
  ctx.font=`700 ${font}px ${FONT_ZH}`;
  while(ctx.measureText(word).width>96&&font>16){font-=1;ctx.font=`700 ${font}px ${FONT_ZH}`;}
  ctx.fillText(word,0,2);
  ctx.restore();
}
function hookShape(x,y,ang,hasTarget){
  ctx.save();ctx.translate(x,y);ctx.rotate(-ang);
  ctx.lineCap='round';ctx.lineJoin='round';
  // Compact swivel & shank
  ellipse(0,-11,4.5,4.5,'#f59e0b');
  ellipse(0,-11,2,2,'#451a03');
  line([[0,-10],[0,0]],'#334155',6.5);
  line([[0,-10],[0,0]],'#e2e8f0',3);
  // Left & right compact grapple claws
  for(const s of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(0,-1);
    ctx.quadraticCurveTo(s*14,2,s*12,11);
    ctx.lineTo(s*7.5,14.5);
    ctx.lineWidth=6.5;ctx.strokeStyle='#334155';ctx.stroke();
    ctx.lineWidth=3.2;ctx.strokeStyle='#f8fafc';ctx.stroke();
    ellipse(s*7.5,14.5,2.2,2.2,'#fbbf24');
  }
  // Precision center bead
  ellipse(0,2,3.4,3.4,hasTarget?'#38bdf8':'#fbbf24');
  ctx.restore();
}
function drawAimSight(hx,hy,target){
  const ux=Math.sin(angle),uy=Math.cos(angle);
  const startD=18;
  const maxSight=isMobile?140:160;
  const endD=target?Math.min(maxSight,Math.max(36,target.dist-lineLength)):maxSight;
  const locked=Boolean(target);
  const dotColor=locked?'#7dd3fc':'#fef08a';
  const strokeColor='rgba(15,23,42,.58)';
  ctx.save();
  // Compact graduated precision dots along exact shot vector
  for(let d=startD;d<=endD-12;d+=14){
    const px=hx+ux*d,py=hy+uy*d;
    const alpha=Math.max(.32,1-(d-startD)/(maxSight*1.15));
    ctx.globalAlpha=alpha;
    ctx.beginPath();ctx.arc(px,py,2.8,0,Math.PI*2);ctx.fillStyle=strokeColor;ctx.fill();
    ctx.beginPath();ctx.arc(px,py,1.7,0,Math.PI*2);ctx.fillStyle=dotColor;ctx.fill();
  }
  // Compact precision crosshair reticle at tip of sight
  const rx=hx+ux*endD,ry=hy+uy*endD;
  ctx.globalAlpha=.95;
  ctx.translate(rx,ry);ctx.rotate(-angle);
  ctx.beginPath();ctx.arc(0,0,7.5,0,Math.PI*2);
  ctx.lineWidth=3.2;ctx.strokeStyle=strokeColor;ctx.stroke();
  ctx.lineWidth=1.8;ctx.strokeStyle=dotColor;ctx.stroke();
  for(const [ax,ay,bx,by] of [[0,-11,0,-5],[0,5,0,11],[-11,0,-5,0],[5,0,11,0]]){
    line([[ax,ay],[bx,by]],strokeColor,3);
    line([[ax,ay],[bx,by]],dotColor,1.5);
  }
  ctx.beginPath();ctx.arc(0,0,2.2,0,Math.PI*2);ctx.fillStyle=locked?'#38bdf8':'#f59e0b';ctx.fill();
  ctx.restore();

  // Exact target contact marker when sight locks onto a nugget beyond compact sight
  if(target&&target.dist-lineLength>maxSight){
    ctx.save();
    ctx.beginPath();ctx.arc(target.x,target.y,5.5,0,Math.PI*2);
    ctx.fillStyle='rgba(15,23,42,.55)';ctx.fill();
    ctx.beginPath();ctx.arc(target.x,target.y,3.2,0,Math.PI*2);
    ctx.fillStyle='#38bdf8';ctx.fill();
    ctx.restore();
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);background();
  const hx=pivot.x+Math.sin(angle)*lineLength,hy=pivot.y+Math.cos(angle)*lineLength;
  const aimTarget=(stage==='playing'&&mode==='swing')?findAimTarget():null;
  // Cable from guide pulley to hook
  line([[pivot.x,pivot.y],[hx,hy]],'#334155',5.5);
  line([[pivot.x,pivot.y],[hx,hy]],'#f1f5f9',2.2);
  for(const g of objects){
    if(g.visible&&g!==attached)goldPiece(g,g.x,g.y,aimTarget&&aimTarget.hit===g);
  }
  if(stage==='playing'&&mode==='swing')drawAimSight(hx,hy,aimTarget);
  miner();
  hookShape(hx,hy,angle,Boolean(aimTarget));
  if(attached){
    const ux=Math.sin(angle),uy=Math.cos(angle);
    goldPiece(attached,hx+ux*24,hy+uy*24,false);
  }
  for(const p of popups){
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.font=`800 26px ${FONT_UI}`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(15,23,42,.75)';ctx.strokeText(p.text,p.x,p.y);
    ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y);
    ctx.restore();
  }
  if(stage==='paused'){
    rounded((W-280)/2,H/2-40,280,80,16,'rgba(255,253,247,.95)','#d97706',4);
    ctx.font=`800 32px ${FONT_UI}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#78350f';ctx.fillText('TẠM DỪNG',W/2,H/2+1);
  }
}
function frame(now){const dt=Math.min(.035,(now-lastTime)/1000||0);lastTime=now;step(dt);draw();requestAnimationFrame(frame);}
function blurOnPointer(btn){btn.addEventListener('click',e=>{if(e.detail>0)btn.blur();});}
document.querySelectorAll('.controls button,.toggle-pill input').forEach(blurOnPointer);

$('fire').onclick=fire;
canvas.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();fire();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();fire();}});
$('pause').onclick=pause;
$('retry').onclick=()=>{
  const snap={question,score,money,remaining,lastMistake};
  const resumeCurrent=()=>{stage='playing';setPauseLabel(false);};
  overlay('↺ Thử lại câu này',`Bạn đang ở câu ${question+1}/28.\nLàm mới lại các thỏi vàng của câu này mà không mất tiến độ hay điểm.`,'▶ Làm mới câu này',()=>resumeAt(snap),'Tiếp tục như cũ',resumeCurrent);
};
$('restart').onclick=()=>{
  const resumeCurrent=()=>{stage='playing';setPauseLabel(false);};
  overlay('↻ Chơi lại từ đầu?', 'Bạn có thể tiếp tục từ câu đang làm nếu không muốn bắt đầu lại.', '↻ Bắt đầu lại',reset,'▶ Tiếp tục câu đang làm',resumeCurrent);
};
$('sound').onclick=()=>{
  soundOn=!soundOn;
  if(!soundOn&&'speechSynthesis'in window)window.speechSynthesis.cancel();
  $('sound').innerHTML=soundOn?'&#128266;<span class="btn-label"> &#194;m thanh</span>':'&#128263;<span class="btn-label"> T&#7855;t &#226;m</span>';
  if(soundOn)speakChinese('对了');
};
$('helpBtn').onclick=()=>{
  const resumeCurrent=()=>{stage=wasStage;setPauseLabel(stage==='paused');};
  const wasStage=stage==='paused'?'paused':'playing';
  overlay('❓ Hướng dẫn chơi',`• Thước ngắm tự động đung đưa, chấm ngắm & viền thỏi vàng sẽ sáng lên khi vào tầm.\n• Nhấn Space, chạm vào màn hình game hoặc bấm "Thả móc" để đào.\n• Đào đúng: +100 điểm | Đào sai: −5 điểm (tự lưu tiến độ).\n• Bật "∞ Không giờ" để dùng trên lớp học không giới hạn thời gian.`,'▶ Đã hiểu, tiếp tục',resumeCurrent);
};
const fsBtn=$('fullscreen');
if(!document.documentElement.requestFullscreen){fsBtn.style.display='none';}
else{
  fsBtn.onclick=()=>{const b=document.querySelector('.page');if(!document.fullscreenElement&&b.requestFullscreen)b.requestFullscreen().catch(()=>{});else if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();};
}
$('noTimer').onchange=updateStats;

if(typeof ResizeObserver!=='undefined'){new ResizeObserver(fitBoard).observe($('boardWrap'));}
window.addEventListener('resize',()=>applyViewportConfig(true));
if(mobileQuery.addEventListener)mobileQuery.addEventListener('change',()=>applyViewportConfig(true));

window.__minerDebug={get:()=>({question,score,money,stage,angle,mode,remaining,objects:objects.map(o=>({...o}))}),setAngle:a=>{angle=a;},setTime:t=>{remaining=t;},goTo:i=>{question=i;stage='playing';spawn();renderQuestion();},success:()=>{attached=objects.find(o=>o.id===question);returnHook();},wrong:()=>{attached=objects.find(o=>o.id!==question);returnHook();},advance,reset,tick:dt=>step(dt),win:()=>endOfGame(true)};

applyViewportConfig(false);
spawn();renderQuestion();setMessage('🎣 Nhấp “Bắt đầu chơi” để bắt đầu.');
const saved=getProgress();
if(saved)overlay('⛏ 黄金矿工 · HSK 4',`Bạn đã học đến câu ${saved.question+1}/28.\n15 phút cho cả 28 câu, đào sai chỉ −5 điểm.`,'▶ Tiếp tục câu đang dở',()=>resumeAt(saved,Math.max(0,180-(saved.remaining||0))),'↻ Chơi từ đầu',reset);
else overlay('⛏ 黄金矿工 · HSK 4',`28 câu · 7 màn · 15 phút tổng.\nĐào đúng +100 điểm, đào sai −5 điểm.\nCanh thước ngắm để đào chính xác thỏi vàng phù hợp!`,'▶ Bắt đầu chơi',reset);

requestAnimationFrame(frame);
</script>
